<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kode Morse</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Game Kode Morse</h1>
    </header>

    <main>
        <section id="game-section">
            <div id="morse-code-display"></div>
        </section>

        <section>
            <input type="text" id="user-input" placeholder="Masukkan jawaban Anda">
            <button id="submit-button">Kirim</button>
            <div id="feedback"></div>
        </section>

        <section id="score-section">
            <h2>Skor Anda: <span id="score">0</span></h2>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Game Kode Morse. All rights reserved.</p>
    </footer>
</body>
</html>
