<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kode Morse</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <section id="welcome">
        <header>
            <h1>Morse Quest</h1>
        </header>
        <main>
            <p>Learn • Play • Improve</p>
            <button id="start-button">START GAME</button>
        </main>
    </section>

    <section id="main-menu" hidden>
        <h1>Pilih Mode</h1>
        <div class="mode-list">
            <button class="mode-container" data-mode="learn">
                <img src="book.svg" class="mode-icon" alt="">
                <h3>Learn</h3>
                <p>Belajar kode Morse</p>
            </button>

            <button class="mode-container" data-mode="time-attack">
                <img src="stopwatch.svg" class="mode-icon" alt="">
                <h3>Time Attack</h3>
                <p>Tes kecepatanmu</p>
            </button>
        </div>
    </section>

    <section id="game-screen" hidden>
        <h1 id="game-title">Learn</h1>
        <div id="game-content">
        
        </div>
    </section>
</body>
</html>
